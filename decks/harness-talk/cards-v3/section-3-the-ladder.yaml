section:
  id: "3"
  title: "The Ladder"
  goal: "Tell the whole operator's journey as four condensed steps, one slide each."

cards:
  - id: "3.1"
    name: "Ladder Step 1: Prompter"
    type: "concept"
    title: "Ladder Step 1 · Prompter: you are the entire harness"
    subtitle: "At the first step every non-token job is yours, and the prompt is being asked to do the work of an operating system."
    takeaway: "Prompting is not the problem. Architecture is."
    visual:
      kind: "duo"
      left:
        kind: "points"
        items:
          - { label: "You are the whole harness", caption: "assemble context, run tools, track state, judge output, by hand" }
          - { label: "The paste loop is the symptom", caption: "copy task, paste files, paste errors, paste logs, retry" }
          - { label: "The prompt does an OS's job", caption: "tools, memory, state, recovery, evaluation" }
      right:
        title: "One prompt, six jobs"
        kind: "overloaded_prompt"
        center: "One prompt"
        jobs: ["Context", "Memory", "Tools", "State", "Recovery", "Evaluation"]
    speaker: "Condenses 3.2 manual harness + 3.3 paste loop + 3.4 prompt-as-OS."
    status: "draft"

  - id: "3.2"
    name: "Ladder Step 2: Supervisor"
    type: "concept"
    title: "Ladder Step 2 · Supervisor: the model gets hands"
    subtitle: "A tool loop turns tokens into actions, but you still babysit the loop, and attention is the bottleneck."
    takeaway: "You can supervise one or two loops. Not twenty."
    visual:
      kind: "duo"
      left:
        kind: "points"
        items:
          - { label: "A tool loop turns tokens into actions", caption: "act → observe → adjust; the harness gives the model hands" }
          - { label: "Supervise one or two loops, not twenty", caption: "the bottleneck moves from execution to coordination" }
          - { label: "Memory is still a design choice", caption: "grep, markdown, RAG, or graph, pick per task" }
      right:
        title: "The loop"
        kind: "tool_loop"
        core: "MODEL"
        phases: ["ACT", "OBSERVE", "ADJUST"]
        modules: ["Terminal", "Filesystem", "Git", "Tests"]
    speaker: "Condenses 4.2 tool loop + 4.3 hands + 4.8 ceiling + 4.9 memory. (Perception detail lives in its own segment.)"
    status: "draft"

  - id: "3.3"
    name: "Ladder Step 3: Orchestrator"
    type: "concept"
    title: "Ladder Step 3 · Orchestrator: the control plane"
    subtitle: "The interface changes from prompt to spec; WORKFLOW.md turns repo rules and board state into isolated agent runs."
    takeaway: "The orchestrator does not do the work. It governs how work becomes agent-executable."
    visual:
      kind: "duo"
      left:
        kind: "points"
        items:
          - { label: "Prompt → spec", caption: "you define bounded work, not requests" }
          - { label: "WORKFLOW.md is infrastructure", caption: "YAML = harness contract · Markdown = agent contract" }
          - { label: "One ticket → one isolated run", caption: "loader reads WORKFLOW.md → workspace → mcp.json → agent → PR → review" }
      right:
        title: "The control plane"
        kind: "control_plane"
        repo: { title: "Target repo", items: "WORKFLOW.md · AGENTS.md · specs/*.md", note: "the operating contract" }
        orchestrator: { title: "Orchestrator", items: ["Workflow loader", "State reconciler", "Workspace manager", "Runtime launcher"] }
        board: { title: "Task board", items: "Linear · Jira · Issues", note: "Ready → In progress → Review" }
        workspace: { title: "Per-ticket workspace", items: "ENG-142/ · mcp.json · logs", note: "isolates blast radius" }
        agent: { title: "Agent runtime", items: "Claude · Codex · tools + MCPs" }
        sink: { title: "PR + Human Review", note: "closes the loop" }
    speaker: "Condenses 5.2 prompt→spec + 5.3/5.5 coordination + 5.6/5.7 WORKFLOW.md + 5.9 control plane + 5.8 loop. Walk the WORKFLOW.md loop here."
    status: "draft"

  - id: "3.5"
    name: "Mission Control"
    type: "metaphor"
    title: "You don't fly one suit. You operate the fleet."
    subtitle: "The human moves from direct execution to controlled delegation."
    layout: hero
    caption: ["You own: specs · constraints · review", "Harness runs: agents · workspaces · retries · gates"]
    takeaway: "Operator mode is not absence of humans. It is better placement of humans."
    visual:
      kind: "image"
      transparent: false
      brief: >
        A mission-control room seen from behind an operator, facing a wall of
        screens; each screen shows a small agent 'suit' running a task. Calm,
        technical blueprint line-art, steel with cyan and orange accents.
      overlay: ["Ticket A", "Ticket B", "Ticket C", "CI", "Review", "Logs"]
    speaker: "The visual payoff of the Operator step, the fleet under one operator."
    status: "draft"

  - id: "3.4"
    name: "Ladder Step 4: Operator"
    type: "concept"
    title: "Ladder Step 4 · Operator: you run the fleet"
    subtitle: "You move from doing the work to operating the system that turns specs into safe, reviewed work."
    takeaway: "The unit of engineering changed, from writing code to designing the system that produces it."
    visual:
      kind: "duo"
      left:
        kind: "points"
        items:
          - { label: "Operate the fleet, not one suit", caption: "controlled delegation across many agents" }
          - { label: "The human owns judgment", caption: "specs, constraints, review, not every step" }
          - { label: "No self-grading", caption: "CI and human review decide 'done'" }
          - { label: "Verification = spec compliance", caption: "intent, behavior, structure" }
      right:
        title: "Who owns what"
        kind: "transfer"
        from: { label: "Human owns", items: ["specs", "priorities", "constraints", "review", "exceptions"] }
        to: { label: "Harness owns", items: ["execution", "state", "tools", "retries", "tests", "PR creation"] }
    speaker: "Condenses 6.3 judgment + 6.5 no self-grading + 6.8 verification + 6.7 unit changed."
    status: "draft"
