# Deck metadata + build config for the NotebookLM-style card model.
deck:
  title: "You Are the Harness"
  subtitle: "The Operator's Journey from Prompting to Agent Systems"
  audience: "Engineering practitioners / harness engineering"
  style: >
    NotebookLM-style explainer cards: light, clean, diagram-first. One teaching
    card per slide, big title, a subtitle that teaches, a central visual, and a
    bottom takeaway. The slide teaches the idea; the speaker expands it.
  core_lines:
    - "You are the harness."
    - "Agent = Model + Harness."
    - "A model produces tokens. An agent produces actions."
    - "You don't pick the brain. You build the body."
    - "The model may be the brain. The harness is the operational body."
    - "The spec is the new keyboard."
    - "Every failure on one rung becomes the design requirement for the next."
  source:
    - "Harness Talk, NotebookLM-Style Slide Builder Skill (Notion)"
    - "Harness Engineering, The Operator's Journey (Notion talk page)"
  # Status gate: draft < ready < final. Only cards >= min_status render.
  min_status: "ready"
  # The 20-slide "spine" core cut, in narrative order (blueprint build target).
  core: ["0.1", "0.3", "0.4", "1.1", "1.2", "1.12", "1.9", "1.4", "1.5", "2.1", "2.5", "3.4", "4.2", "4.4", "4.5", "4.9", "5.2", "5.6", "5.7", "5.9", "5.8", "6.2", "6.3", "6.5", "6.8", "6.6", "7.2", "7.3"]

# AI infographic generation (hybrid route). Structural diagrams stay coded;
# cards with `visual.kind: image` get a Gemini-generated illustration whose
# title/subtitle/takeaway/labels are laid over it as crisp HTML.
art:
  # "Nano Banana". Override with GEMINI_IMAGE_MODEL. Confirmed at wire-time.
  model: "gemini-2.5-flash-image"
  aspect: "16:9"
  # Shared style preamble prepended to every image prompt so the whole deck
  # shares one visual language. NOTE: "no text", we overlay words as HTML.
  style: >
    Technical blueprint / engineering-schematic illustration on a pale sage-green
    graph-paper background (#e8ede1) with a faint navy grid. Dark navy-teal linework
    (#00292e), lime-green structural/data lines (#bfd732), and forest-green accents
    (#1f7a3d). Isometric or clean orthographic, precise, calm, generous margins,
    centered subject, 16:9. Absolutely no text, no words, no letters, no numbers
    anywhere in the image.
