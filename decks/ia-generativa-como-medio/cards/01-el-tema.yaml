section:
  id: '1'
  title: El tema · de herramienta a medio y ambiente
  laminas: 4
  tiempo: '1:20'
cards:
- id: '02'
  name: El encuadre común
  idea_ref: 1
  layout: diagrama_columnas
  idea_central: Cuando hablamos de IA en el trabajo hablamos de velocidad, y esa mirada se queda
    corta.
  entrega: La conversación sobre IA en el trabajo se quedó en la velocidad.
  en_pantalla: 'Diagrama. Dos columnas enfrentadas: lo que la conversación mide y lo que no.'
  visual:
    kind: columnas
    izq:
      titulo: Lo que se mide
      items:
      - tiempo ahorrado
      - volumen producido
      - costo por pieza
      - velocidad de entrega
    der:
      titulo: Lo que no
      items:
      - el criterio
      - la voz propia
      - la autoría
      - lo que se dejó de notar
  speaker: 'No descalificar esa mirada: decir que es útil y que se queda corta.'
  soporte:
    seccion: §7.1 Justificación
    cita: 'La inteligencia artificial generativa ya forma parte del trabajo creativo y comunicativo,
      y eso abre una pregunta que no se agota en lo instrumental. Buena parte de la conversación
      académica la ha observado desde la productividad, la adopción y el empleo; es una mirada útil,
      aunque se queda corta cuando el problema se examina desde la comunicación, porque la IA no
      solo acelera tareas: interviene en la producción de sentido. Parto de una convicción que no
      quiero disimular: ningún medio es neutro, y este menos. Leerla desde la ecología de los medios,
      como medio y ambiente y no como una herramienta más, permite formular la pregunta que da sentido
      al proyecto: si el medio es el mensaje, ¿cuál es el “mensaje” de la IA generativa como medio?
      (Petricini, 2024; Islas et al., 2024; Scolari, 2023).'
  status: draft
  copy:
    titular: La conversación se quedó<br>en la mitad medible.
  guion: Cuando hablamos de inteligencia artificial en el trabajo, hablamos de velocidad. Cuánto
    tiempo ahorra, cuánto produce, cuánto cuesta. Es una mirada útil y hay buena investigación ahí.
    Pero mide solo la mitad, y deja por fuera justo lo que me interesa.
- id: '03'
  name: Interviene en el sentido
  idea_ref: 2
  layout: diagrama_flujo
  idea_central: 'La IA no solo acelera tareas: sugiere, ordena, completa y reformula el lenguaje
    con el que pensamos.'
  entrega: 'La IA no acelera el lenguaje: lo escribe con nosotros.'
  en_pantalla: Diagrama. El lenguaje entra, pasa por cuatro operaciones y sale distinto.
  visual:
    kind: flujo
    entra: lo que ibas a decir
    pasos:
    - sugiere
    - ordena
    - completa
    - reformula
    sale: lo que queda escrito
  soporte:
    seccion: §4.1.1 De la herramienta al medio
    cita: La tradición de la ecología de los medios ofrece un punto de partida para este desplazamiento.
      McLuhan propuso que el significado cultural de una tecnología no reside únicamente en los contenidos
      que transmite, sino en la reorganización perceptiva, social y simbólica que introduce. Desde
      esta perspectiva, el “mensaje” de un medio se encuentra en la forma de relación que instala.
      Aplicada a la IA generativa, esta intuición permite preguntar no solo qué textos, imágenes
      o respuestas produce, sino qué hábitos de pensamiento, escritura y comunicación se estabilizan
      cuando los profesionales comienzan a trabajar con sistemas capaces de sugerir, completar, ordenar
      y reformular el lenguaje.
  status: draft
  copy:
    titular: No acelera el lenguaje.<br>Lo escribe contigo.
  guion: Porque la IA no solo acelera tareas. Interviene en la producción de sentido. Sugiere, ordena,
    completa y reformula el lenguaje con el que pensamos. Lo que ibas a decir entra por un lado,
    y lo que queda escrito sale por el otro.
- id: '04'
  name: Qué es un medio
  idea_ref: 3
  layout: imagen_titular
  idea_central: Un medio importa menos por lo que transporta que por lo que reorganiza.
  entrega: Lo que una tecnología reorganiza pesa más que lo que transporta.
  en_pantalla: Imagen a sangre. Frase corta abajo a la izquierda.
  visual:
    kind: image
    brief: Luz dura atravesando un vidrio grueso texturado y proyectando su sombra deformada sobre
      una superficie lisa. Lo que sale no es lo que entró. Plano cerrado, la imagen llena todo el
      encuadre de borde a borde, sin ningún marco.
    acento: true
  speaker: Acá entra McLuhan, dicho, no escrito en pantalla.
  soporte:
    seccion: §4.1.1 De la herramienta al medio
    cita: La tradición de la ecología de los medios ofrece un punto de partida para este desplazamiento.
      McLuhan propuso que el significado cultural de una tecnología no reside únicamente en los contenidos
      que transmite, sino en la reorganización perceptiva, social y simbólica que introduce. Desde
      esta perspectiva, el “mensaje” de un medio se encuentra en la forma de relación que instala.
      Aplicada a la IA generativa, esta intuición permite preguntar no solo qué textos, imágenes
      o respuestas produce, sino qué hábitos de pensamiento, escritura y comunicación se estabilizan
      cuando los profesionales comienzan a trabajar con sistemas capaces de sugerir, completar, ordenar
      y reformular el lenguaje.
  status: draft
  copy:
    titular: Lo que reorganiza pesa más<br>que lo que transporta.
  guion: Y eso ya no es una herramienta que uno toma y suelta. McLuhan decía que una tecnología importa
    menos por lo que transporta que por lo que reorganiza. Su mensaje no está en lo que lleva, sino
    en la relación que instala.
- id: '05'
  name: Qué es un ambiente
  idea_ref: 4
  layout: imagen_sola
  idea_central: Un ambiente no se ve desde adentro, no porque sea invisible sino porque es todo lo
    que hay.
  entrega: Un ambiente no se ve mientras estás adentro.
  en_pantalla: Imagen a sangre con el titular abajo a la izquierda.
  visual:
    kind: image
    brief: Superficie del agua vista desde abajo, a contraluz. El espectador está sumergido sin haberlo
      notado. Monocromo, con el azul de acento solo en la luz que cruza.
    acento: true
  soporte:
    seccion: §7.2 Marco conceptual
    cita: 'Este marco parte de una decisión teórica: mirar la IA generativa desde la ecología de
      los medios, una tradición que no entiende las tecnologías de comunicación como instrumentos
      neutrales que se usan y se sueltan, sino como ambientes que reorganizan la percepción, la cultura
      y las formas de producir sentido (McLuhan; Postman). Un medio, en esta clave, importa menos
      por los mensajes que transporta que por las condiciones de relación que instala: qué vuelve
      fácil, qué desplaza, qué normaliza, qué tipo de pensamiento favorece. Leer así la IA generativa,
      como medio y ambiente y no como una herramienta más, es hoy una posición vigente y revisada
      por varios autores (Petricini, 2024; Islas et al., 2024; Scolari, 2023). Es también la lente
      que vuelve pertinente el proyecto para la línea de medios emergentes.'
  status: draft
  copy:
    titular: Un ambiente no se ve<br>mientras estás adentro.
  guion: Un medio, en esa clave, es un ambiente. Y un ambiente no se ve desde adentro. No porque
    sea invisible, sino porque es todo lo que hay. El pez sería el último en descubrir el agua.
