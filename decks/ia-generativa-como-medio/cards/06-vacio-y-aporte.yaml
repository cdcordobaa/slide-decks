- id: '19'
  name: La ontología relacional
  idea_ref: 56
  layout: red
  idea_central: El aporte es nombrar las entidades y las relaciones que reaparecen en estas prácticas.
  entrega: Nombrar esas relaciones es lo que esta investigación va a construir.
  en_pantalla: Diagrama construido. Red de nodos y relaciones.
  visual:
    kind: network
    items:
    - profesional
    - prompt
    - output
    - criterio
    - voz
    - autoría
    - organización
    - poder
    note: lo que importa son los verbos de las aristas, no los nodos
  speaker: Construido a mano. Una red generada por IA sale con etiquetas ilegibles.
  soporte:
    seccion: §7.2.4 La ontología relacional
    cita: 'Estos lentes no se quedan sueltos. La apuesta del marco es ordenarlos en lo que aquí se
      llama, por ahora, una ontología relacional de las mediaciones humano–IA. Es una manera de nombrar
      las entidades y las relaciones que reaparecen en estas prácticas: profesional, herramienta,
      prompt, output, criterio, autoría, voz, organización, audiencia, poder. Su función es metodológica
      además de conceptual. Cada relación que el marco vuelve visible; qué se delega, cómo se negocia
      la autoría, dónde se ejerce o se cede el criterio, se convierte en una categoría con la que
      se leerán las entrevistas y la etnografía digital. Y devuelve la pregunta al lugar donde empezó,
      que no es la productividad sino el pensar y la voz: qué le pasa al criterio y al sentido de
      autoría cuando escribir y decidir empiezan a hacerse con sistemas generativos.'
  status: draft
