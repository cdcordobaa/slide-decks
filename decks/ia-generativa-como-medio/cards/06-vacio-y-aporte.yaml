section:
  id: '6'
  title: El vacío y el aporte
  laminas: 3
  tiempo: '1:00'
cards:
- id: '17'
  name: El vacío
  idea_ref: 54
  layout: imagen_diagrama
  idea_central: 'Hay medición y hay marcos: falta el relato en primera persona de quienes ya trabajan
    así.'
  entrega: Sabemos cuánto se usa, no sabemos cómo lo vive quien lo usa.
  en_pantalla: Solo imagen. Espacio negativo dominante.
  visual:
    kind: image
    brief: Una silla vacía frente a un escritorio en uso, o un hueco exacto en una serie de objetos
      alineados. Una ausencia con forma, no un vacío genérico.
    acento: false
    overlay:
      kind: contraste
      'off': lo medido
      'on': lo vivido
  soporte:
    seccion: §4.6.2 El vacío identificado
    cita: Cada una de esas capas aporta una pieza distinta, sea teórica, empírica cuantitativa, empírica
      cualitativa, crítica o contextual. Lo que la literatura todavía no integra es una mirada sobre
      la manera en que los propios profesionales creativos describen, nombran e interpretan la reconfiguración
      de su forma de pensar, escribir y comunicar en el trabajo cotidiano. Existen mediciones de
      adopción, marcos conceptuales consolidados y advertencias sobre los efectos cognitivos, pero
      el relato en primera persona de quienes ya conviven con estas herramientas permanece poco explorado.
      A esa carencia se añade una limitación de localización, pues la mayoría de los estudios empíricos
      revisados se realizó en contextos anglosajones o europeos, o bien midió variables agregadas,
      de modo que la experiencia de los profesionales creativos latinoamericanos sigue siendo un
      terreno escasamente documentado.
  status: draft
  copy:
    titular: Sabemos cuánto se usa.<br>No cómo lo vive<br>quien lo usa.
  guion: Lo que la literatura todavía no integra es cómo los propios profesionales describen, nombran
    e interpretan esa reconfiguración. Hay mediciones de adopción y marcos consolidados. Falta el
    relato en primera persona de quien ya convive con estas herramientas.
