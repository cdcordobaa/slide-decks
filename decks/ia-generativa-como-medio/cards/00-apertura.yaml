cards:
- id: '01'
  name: Apertura
  idea_ref: null
  layout: portada
  idea_central: La escena de trabajo donde ocurre todo lo demás, todavía sin explicar.
  entrega: Esto pasa en un escritorio cualquiera, hoy.
  en_pantalla: Portada. Imagen a sangre con el título encima y la bajada al pie.
  visual:
    kind: image
    brief: Un escritorio de trabajo en penumbra, visto desde arriba. Una mano cerca de un teclado,
      quieta. Luz lateral dura. No se entiende todavía qué está pasando, y esa ambigüedad es el punto.
    acento: false
  speaker: 'Rima con la lámina 20: mismo plano, resuelto.'
  soporte:
    seccion: §2 Resumen
    cita: 'La inteligencia artificial generativa se ha integrado al trabajo creativo y comunicativo
      a una velocidad que supera la capacidad de las organizaciones y las personas para comprender
      sus efectos. Buena parte de la literatura la ha estudiado desde la productividad, la adopción
      y el empleo, pero esa mirada resulta insuficiente cuando el fenómeno se observa desde la comunicación,
      pues la IA generativa interviene en la producción de sentido: sugiere, ordena, completa y reformula
      el lenguaje con que pensamos, escribimos y nos comunicamos. Esta investigación adopta la perspectiva
      de la ecología de los medios y de la teoría de las mediaciones para comprender la IA generativa
      como medio y ambiente, y no como una herramienta neutral. Su pregunta central indaga cómo describen
      los profesionales creativos la reconfiguración de su forma de pensar, escribir y comunicar
      al integrar la IA generativa en su trabajo cotidiano. El supuesto que orienta el estudio sostiene
      que lo que ocurre no es reemplazo ni aumento, sino una reasignación situada de roles: qué se
      delega, qué se retiene y qué se supervisa.'
  status: draft
  copy:
    titulo: La IA generativa<br>como medio
    bajada: Mediaciones, criterio, autoría y la reconfiguración del trabajo creativo en América Latina
  guion: 'Esto es un escritorio cualquiera, un martes cualquiera. Alguien tiene que escribir algo
    hoy: un comunicado, una propuesta, un correo que sí importa. Lo que pasa en esa mesa en los próximos
    minutos es de lo que vengo a hablar.'
