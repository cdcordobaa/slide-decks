title: La IA generativa como medio
subtitle: Mediaciones, criterio, autoría y la reconfiguración del trabajo creativo en América Latina
autora: Paola Andrea Caro Burgos
curso: Taller optativo PDA · Pensamiento de diseño aplicado como estrategia de comunicación creativa
formato: Pecha Kucha · 20 láminas × 20 segundos · 6:40
registro: Charla TED. Una idea específica por lámina.
fuente: fuente/anteproyecto-2026-06-18.md
mapa: MAPA-DE-CONTENIDO.md
sistema_visual:
  tratamiento: Fotografía documental, monocroma cálida sobre el papel del deck. Luz lateral dura,
    sombra larga. Grano fino visible.
  acento: Un único azul saturado que aparece solo donde algo dejó de ser enteramente humano.
  encuadre: Planos cerrados. Manos, superficies, objetos de trabajo. Sin rostros reconocibles.
  prohibido: 'Nada de robots, cerebros, circuitos, humanoides ni manos azules tocándose. Nada de
    stock. Sin marcos, bordes, viñetas, esquinas redondeadas ni efecto de foto antigua sobre papel:
    la imagen llena el encuadre entero, a sangre. Sin destellos de lente decorativos.'
  tipografia: Titulares en Avenir Next Condensed Heavy, versalitas, tracking cerrado. Las dos preguntas
    en New York, serif, en caja baja. Numeración y rótulos en Menlo. El contraste entre condensada
    y serif marca la diferencia entre afirmar y preguntar.
  identidad: 'Cada lámina lleva el mismo aparato gráfico: numeral grande en la esquina, rótulo de
    bloque en mono arriba, y una regla fina que separa. El deck se reconoce sin las fotos.'
  diagramas: Todo concepto que sea una relación se dibuja, no se fotografía. La foto sirve para el
    ambiente y la escena; el diagrama, para la idea.
