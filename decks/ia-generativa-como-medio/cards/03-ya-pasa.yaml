section:
  id: '3'
  title: Qué está pasando ya
  laminas: 2
  tiempo: 0:40
cards:
- id: '10'
  name: Ya es masivo
  idea_ref: 24
  layout: cifra_sobre_imagen
  idea_central: Entre el 10 y el 24 % de la comunicación pública analizada ya tiene marcas de escritura
    asistida.
  entrega: 'Ya no es una hipótesis: está en la escritura pública que leemos.'
  en_pantalla: Cifra enorme sobre imagen al 15 % de opacidad. Pie con la fuente.
  visual:
    kind: image
    brief: Trama de documentos institucionales apilados o superpuestos, muy tenue, casi textura.
      Solo sirve de fondo.
    acento: false
  fuente_dato: Liang et al., 2025
  soporte:
    seccion: §7.1 Justificación
    cita: La pregunta no es especulativa. La práctica que examina ya es masiva, y la veo de cerca
      en mi entorno profesional, donde colegas escriben, deciden y comunican con IA todos los días.
      Liang et al. (2025) estiman que, hacia finales de 2024, entre el 10 % y el 24 % de la comunicación
      pública e institucional analizada mostraba marcas de redacción asistida por modelos de lenguaje,
      y los reportes sectoriales describen una adopción acelerada en el trabajo creativo, acompañada
      de una marcada sensación de falta de preparación (Envato, 2025). En América Latina, los organismos
      internacionales anticipan además una afectación amplia del empleo regional, atravesada por
      la brecha digital (BID, 2025). Todo esto ocurre ya, dentro de las rutinas profesionales.
  status: draft
- id: '11'
  name: Deja huella
  idea_ref: 27
  layout: cifra_sola
  idea_central: El 83 % no pudo citar lo que acababa de escribir, y bajó su sentido de propiedad
    sobre el texto.
  entrega: El texto sale, pero no queda en quien lo escribió.
  en_pantalla: Solo la cifra sobre el papel. Gemela de la 10, más seca.
  visual:
    kind: none
  fuente_dato: Kosmyna et al., 2025
  speaker: 'El contraste entre las dos láminas hace el trabajo: una con fondo, otra desnuda.'
  soporte:
    seccion: §4.3.3 Homogeneización y desplazamiento de la autoría
    cita: Kosmyna et al. (2025) refuerzan esta línea desde la neurofisiología. En un diseño con registro
      de EEG, los textos producidos con asistencia de modelos resultaron más homogéneos dentro del
      grupo, y un 83% de los participantes no logró citar lo que acababa de escribir, con una disminución
      del sentido de propiedad sobre el texto. El estudio sugiere que escribir con el sistema produce
      piezas que el propio autor reconoce con menor claridad como suyas. O'Sullivan (2025) converge
      desde la estilometría al mostrar que la escritura generada ocupa un rango estilístico más estrecho
      que la humana. Estos resultados describen una presión hacia la uniformidad y una atenuación
      del vínculo autoral antes que un desenlace inevitable; por eso la voz propia queda planteada
      como algo que debe sostenerse de manera deliberada cuando el lenguaje llega previamente sugerido.
  status: draft
