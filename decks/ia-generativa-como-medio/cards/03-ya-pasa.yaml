section: { id: "3", title: "Qué está pasando ya", laminas: 2, tiempo: "0:40" }
cards:
  - id: "10"
    name: "Ya es masivo"
    idea_ref: 24
    layout: "cifra_sobre_imagen"
    idea_central: "Entre el 10 y el 24 % de la comunicación pública analizada ya tiene marcas de escritura asistida."
    entrega: "Ya no es una hipótesis: está en la escritura pública que leemos."
    en_pantalla: "Cifra enorme sobre imagen al 15 % de opacidad. Pie con la fuente."
    visual:
      kind: image
      brief: "Trama de documentos institucionales apilados o superpuestos, muy tenue, casi textura. Solo sirve de fondo."
    fuente_dato: "Liang et al., 2025"
    soporte:
      seccion: "§7.1 Justificación"
      cita: >-
        Liang et al. (2025) estiman que, hacia finales de 2024, entre el 10 % y el 24 % de la
        comunicación pública e institucional analizada mostraba marcas de redacción asistida por
        modelos de lenguaje
    status: draft
  - id: "11"
    name: "Deja huella"
    idea_ref: 27
    layout: "cifra_sola"
    idea_central: "El 83 % no pudo citar lo que acababa de escribir, y bajó su sentido de propiedad sobre el texto."
    entrega: "El texto sale, pero no queda en quien lo escribió."
    en_pantalla: "Solo la cifra sobre el papel. Gemela de la 10, más seca."
    visual: { kind: none }
    fuente_dato: "Kosmyna et al., 2025"
    speaker: "El contraste entre las dos láminas hace el trabajo: una con fondo, otra desnuda."
    soporte:
      seccion: "§4.3.3 Homogeneización y desplazamiento de la autoría"
      cita: >-
        un 83% de los participantes no logró citar lo que acababa de escribir, con una disminución
        del sentido de propiedad sobre el texto
    status: draft
