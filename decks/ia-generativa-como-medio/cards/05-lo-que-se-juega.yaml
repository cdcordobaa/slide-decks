section: { id: "5", title: "Lo que se juega", laminas: 3, tiempo: "1:00" }
cards:
  - id: "14"
    name: "La autoría es una cadena"
    idea_ref: 28
    layout: "cadena_5"
    idea_central: "La autoría deja de ser una propiedad del texto y pasa a ser una cadena de decisiones."
    entrega: "La autoría no es una propiedad del texto, es una cadena de decisiones."
    en_pantalla: "Diagrama horizontal. Cinco nodos conectados."
    visual:
      kind: chain_5
      steps: ["idea", "formulación", "edición", "firma", "responsabilidad"]
    speaker: "Sale textual de tu 7.2.2."
    soporte:
      seccion: "§7.2.2 Mediación, agencia, autoría y criterio"
      cita: >-
        Conviene entonces separar idea, formulación, edición, firma y responsabilidad, y tratar la
        autoría como una práctica relacional y no como una propiedad individual del texto
    status: draft
  - id: "15"
    name: "El criterio"
    idea_ref: 33
    layout: "imagen_sangre_palabra"
    idea_central: "El criterio es la capacidad de evaluar, seleccionar y corregir lo que la herramienta ofrece."
    entrega: "El criterio es lo que decide en cada eslabón de esa cadena."
    en_pantalla: "Imagen a sangre. Una palabra."
    visual:
      kind: image
      brief: "Una mano tachando o descartando una hoja impresa. El gesto de decidir, capturado a media acción. El azul de acento solo en la marca que deja."
    soporte:
      seccion: "§7.2.2 Mediación, agencia, autoría y criterio"
      cita: >-
        Y está el criterio, que ocupa el centro de este marco: la capacidad de evaluar, seleccionar
        y corregir lo que la herramienta ofrece.
    status: draft
  - id: "16"
    name: "El riesgo silencioso"
    idea_ref: 58
    layout: "tipografia_invertida"
    idea_central: "El riesgo no es el reemplazo: es ceder criterio y voz sin haberlo decidido."
    entrega: "Lo grave no es perder el trabajo: es ceder la voz sin haberlo decidido."
    en_pantalla: "Única lámina de fondo oscuro de todo el deck. Texto en claro."
    visual: { kind: none }
    speaker: "El cambio de fondo hace el trabajo emocional. No hay que subir la voz."
    soporte:
      seccion: "§7.1 Justificación"
      cita: >-
        El riesgo de fondo es silencioso. No tanto que la IA reemplace el trabajo, sino que cambie
        nuestra forma de pensar y de escribir sin que lo notemos, y que se ceda sin decisión aquello
        que un profesional creativo no debería perder: la voz propia y el criterio.
    status: draft
