section:
  id: "2"
  title: "The Operator's Journey"
  goal: "Give the audience the map of the whole talk before entering the rungs."

cards:
  - id: "2.1"
    name: "The Ladder"
    type: "ladder"
    title: "The operator's journey"
    subtitle: "A continuum — each step moves one more harness responsibility out of the human."
    takeaway: "This is a talk about changing your role, not just changing your tools."
    visual:
      kind: "spectrum"
      stages:
        - { label: "Prompter", caption: "you are the whole harness" }
        - { label: "Supervisor", caption: "execution offloaded" }
        - { label: "Orchestrator", caption: "coordination is the job" }
        - { label: "Operator", caption: "the harness runs it" }
    speaker: "Second anchor slide; we return to this continuum repeatedly."
    status: "draft"

  - id: "2.3"
    name: "The Rule of the Ladder"
    type: "diagram"
    title: "The ladder is about responsibility transfer"
    subtitle: "Each rung is defined by what you stop doing manually."
    takeaway: "The destination is not autonomy without humans. It is controlled delegation."
    visual:
      kind: "transfer"
      from: { label: "Human", items: ["context", "tools", "state", "retry", "eval", "safety"] }
      to: { label: "Harness", items: ["context", "tools", "state", "retry", "eval", "safety"] }
    speaker: "Icons migrate from human to harness as you climb."
    status: "draft"

  - id: "2.4"
    name: "Where We're Going"
    type: "transition"
    title: "From prompting to operating"
    subtitle: "We climb by following the failures: attention, orientation, coordination, trust."
    takeaway: "Every failure on one rung becomes the design requirement for the next."
    visual:
      kind: "flow"
      steps: ["Prompting", "Tool loops", "Multi-agent coordination", "Operational harnesses"]
    speaker: "Set expectations: each rung solves the previous rung's failure."
    status: "draft"

  - id: "2.5"
    name: "Your Harness Becomes a Filesystem"
    type: "concept"
    title: "Your harness becomes a filesystem"
    subtitle: "As you climb, behavior moves into versioned artifacts: maps, skills, MCPs, specs, workflow, design."
    takeaway: "Your harness is version-controlled."
    visual:
      kind: "stack"
      items:
        - { label: "AGENTS.md", caption: "map & conventions" }
        - { label: "DESIGN.md", caption: "architecture & intent" }
        - { label: "skills/*.md", caption: "capability packs" }
        - { label: "mcp.json", caption: "tool servers" }
        - { label: "WORKFLOW.md", caption: "operating procedure" }
        - { label: "specs/*.md", caption: "bounded work" }
        - { label: "memory / evals", caption: "state & judgment" }
    status: "draft"
