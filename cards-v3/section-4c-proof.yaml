section:
  id: "4c"
  title: "Proof: a harness we specified, not wrote"
  goal: "Ground the whole thesis in one real build: the MIP eval harness, grown as ten spec changes running the loop."

cards:
  - id: "P1"
    name: "We Specified It"
    type: "concept"
    title: "We didn't write the harness. We specified it."
    subtitle: "The MIP evaluation harness (two-phase video scoring, statistical rigor, a multimodal judge, cloud batch jobs) was grown as roughly ten written-down changes. The team never sat in the editor."
    takeaway: "Authorship was the agent's job. Orchestration was ours."
    visual:
      kind: "points"
      items:
        - { label: "~10", caption: "specified changes" }
        - { label: "7", caption: "shipped and archived" }
        - { label: "2", caption: "active on cloud" }
        - { label: "1", caption: "concept retired" }
        - { label: "1", caption: "road not taken" }
    speaker: "This is the whole thesis as a real build. The operator decomposed intent into discrete units, handed each to a coding agent, and steered by written record: a proposal, a design, a checklist. Not one line was typed by hand."
    status: "draft"

  - id: "P2"
    name: "The Unit of Work"
    type: "concept"
    title: "Every feature is one change, and every change is the same three files."
    subtitle: "A change moves the system from one agreed state to the next. Its shape is the method: the why, the how, and the checklist, written in that order before a line ships."
    takeaway: "The spec is the source of truth for why the code looks the way it does."
    visual:
      kind: "cards_row"
      items:
        - "proposal.md, the why: pain as a numbered list, plus an explicit Non-Goals fence drawn immediately."
        - "design.md, the how: numbered load-bearing decisions, each with its rejected alternatives named."
        - "tasks.md, the checklist: checkable units with their tests, and the validating result recorded in the header."
    speaker: "The fenced non-goals are not thrown away. Each one later reopens as its own scoped change, so the fence becomes the roadmap. The rejected alternatives get named and defended, for example keeping our own hundred lines over a managed eval service."
    status: "draft"

  - id: "P3"
    name: "The Loop in the Wild"
    type: "system_diagram"
    title: "One change runs this loop. The harness is ten of them in sequence."
    subtitle: "The same spec loop from the last section, caught in the wild. A concrete pain surfaces from running the last version, becomes a proposal, a design, a checklist; the agent implements; a real eval validates; the folder is archived."
    takeaway: "Archive is not the end. Its result supersedes and informs the next problem."
    visual:
      kind: "agentic_search_loop"
      center: "the change loop"
      entry: "a real pain"
      exit: "the next change"
      loop: ["Propose", "Design", "Tasks", "Implement", "Validate", "Archive"]
    speaker: "Propose states the pain and draws the non-goals fence. Design makes the load-bearing calls and names the rejected ones. Tasks breaks it into checkable units with tests. Implement ticks the boxes. Validate runs a real eval and records the outcome in the spec. Archive seeds the next change."
    status: "draft"

  - id: "P4"
    name: "Grown, Not Designed"
    type: "concept"
    title: "The harness was not designed up front. It was grown, one specified decision at a time."
    subtitle: "The true build order, reconstructed from each proposal's dependencies. Each phase settled exactly one load-bearing decision. One was abandoned before a line was written, and one deleted a concept the method had outgrown."
    takeaway: "Every non-goal became the next change. The fence became the roadmap."
    visual:
      kind: "spectrum"
      stages:
        - { label: "framework" }
        - { label: "rigor" }
        - { label: "isolation" }
        - { label: "data + UI" }
        - { label: "multimodal" }
        - { label: "batch" }
        - { label: "retire" }
    speaker: "Phase zero was the minimal instinct, roughly 250 lines on a laptop, written down, looked at whole, and rejected. Every one of its non-goals became a feature of the harness that shipped. The last phase is spec-driven development catching its own redundancy and deleting pre-registration, keeping the practice as a field, not a file."
    status: "draft"
