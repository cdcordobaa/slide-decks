section:
  id: "4"
  title: "Perception & Orientation"
  goal: "A cross-cutting segment: how a harness shapes what the agent can see and how fast it orients — relevant at every step."

cards:
  - id: "4.4"
    name: "Code Understanding Is a Harness Capability"
    type: "comparison"
    title: "When an agent 'doesn't understand the code,' ask what eyes it has"
    subtitle: "Same model, different harness, different code vision."
    layout: hero
    caption: ["Raw chat → line", "Grep → path", "Cursor → map", "Sandbox → hologram"]
    image:
      brief: >
        A technical blueprint comparison showing the same piece of code understood at
        four increasing depths, left to right: (1) a single highlighted line of code,
        (2) a branching file-path tree, (3) a 2D map of connected modules, (4) a 3D
        holographic exploded view of the whole system. Steel-grey line-art, cyan
        structural lines, orange highlights; each stage visibly richer than the last.
        No text, no labels.
    takeaway: "Do not blame the brain before inspecting the body."
    visual:
      kind: "comparison"
      boxes:
        - { label: "Raw chat", result: "sees a line" }
        - { label: "Grep / filesystem agent", result: "sees a path" }
        - { label: "Cursor-like harness", result: "sees a map" }
        - { label: "Cloud / sandbox agent", result: "sees a hologram" }
    speaker: "Where Cursor/codebase indexing and sandboxed agents fit."
    status: "draft"

  - id: "4.5"
    name: "Orientation Tax"
    type: "failure_mode"
    title: "Orientation Tax"
    subtitle: "Before an agent can work, it must first figure out where it is."
    layout: split
    side: image-left
    body:
      - "Where are the relevant files?"
      - "What command runs the tests?"
      - "What conventions does the repo follow?"
      - "What architecture — and hidden assumptions — apply?"
    takeaway: "Good harnesses pay this tax once. Bad harnesses pay it every run."
    visual:
      kind: "image"
      transparent: false
      brief: >
        A small robot agent standing at the entrance of a large maze shaped like a
        software repository — folders and files forming the walls — looking unsure
        at a fork. Technical blueprint line-art, steel with cyan and orange accents.
      overlay: ["relevant files?", "test command?", "conventions?", "architecture?", "hidden assumptions?"]
    speaker: "Quick repo examples: auth, packages, tests, style."
    status: "draft"

  - id: "4.6"
    name: "Paying Down the Orientation Tax"
    type: "capability_map"
    title: "A good harness gives the agent a map"
    subtitle: "Maps, skills, memory, and conventions reduce re-orientation every run."
    takeaway: "The agent should not rediscover the codebase from scratch."
    visual:
      kind: "capability_map"
      center: "Orientation Tax ↓"
      items: ["AGENTS.md", "Repo map", "Code search", "Embeddings", "Skills", "Memory", "Test commands", "Known failure notes"]
    speaker: "Introduce AGENTS.md as 'map, not manual.'"
    status: "draft"

  - id: "4.7"
    name: "Context Anxiety"
    type: "failure_mode"
    title: "Context Anxiety"
    subtitle: "The model starts behaving as if context is scarce or unstable."
    takeaway: "Context management is a harness responsibility."
    visual:
      kind: "failure_mode"
      center: "context window ~ full"
      items: ["rushing", "truncating", "over-summarizing", "forgetting constraints", "declaring done too early"]
    speaker: "Not just model weakness; unmanaged runtime state."
    status: "draft"
